name: Create Mentoria Video

on:
  workflow_dispatch:  # Solo manual

jobs:
  create-video:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
    
    - name: Create video
      run: python create_mentoria_video.py
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: video-mentoria
        path: |
          output/mentoria_video.mp4
          output/mentoria_voice.mp3
          output/mentoria_thumbnail.jpg
        retention-days: 30
    
    - name: Show results
      run: |
        ls -lh output/
        echo "✅ Video generado correctamente"
