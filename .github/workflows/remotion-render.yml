name: 🎬 Render Remotion Video

on:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
  workflow_dispatch:

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/remotion-dev/remotion:latest
      
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Install dependencies
        working-directory: remotion
        run: npm ci

      - name: 🎬 Render video
        working-directory: remotion
        run: remotion render src/index.tsx Video out/video.mp4

      - name: 📤 Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/video.mp4
          retention-days: 30
