name: 🎬 Render Remotion Video

on:
  push:
    branches: [main]
    paths:
      - 'remotion/**'
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to render'
        default: 'Video'
        type: string

jobs:
  render:
    name: Render Video
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: remotion/package-lock.json

      - name: 🔄 Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libnssutil3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2

      - name: 📦 Install dependencies
        working-directory: remotion
        run: npm ci

      - name: 🎬 Render video
        working-directory: remotion
        run: |
          npx remotion render src/index.tsx Video out/video.mp4 --log=verbose
        env:
          REMOTION_CONCURRENCY: 2

      - name: 📤 Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-video
          path: remotion/out/video.mp4
          retention-days: 30
